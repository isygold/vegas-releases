name: Build VEGAS Port for DXVK-Sarek

on:
  workflow_dispatch:       # manual trigger
  push:
    branches: [ "vegas-sarek-port" ]

env:
  SAREK_REPO: "pythonlover02/DXVK-Sarek"
  SAREK_REF:  "main"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, i686]
    steps:
      # 1. Check out the patch/workflow repo itself
      - uses: actions/checkout@v4
        with:
          path: patches-repo

      # 2. Install MinGW cross-compiler & build tools
      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            meson ninja-build \
            g++-mingw-w64-x86-64 \
            g++-mingw-w64-i686 \
            p7zip-full

      # 3. Clone DXVK-Sarek
      - name: Clone DXVK-Sarek
        run: |
          git clone https://github.com/${{ env.SAREK_REPO }}.git \
            --branch ${{ env.SAREK_REF }} \
            --depth 1 \
            dxvk-sarek

      # 4. Copy new source files
      - name: Copy new VEGAS source files
        run: |
          cp -v patches-repo/src/dxvk/dxvk_vegas.h   dxvk-sarek/src/dxvk/
          cp -v patches-repo/src/dxvk/dxvk_vegas.cpp dxvk-sarek/src/dxvk/

      # 5. Apply patches
      - name: Apply patches to DXVK-Sarek
        run: |
          cd dxvk-sarek
          for p in ../patches-repo/patches/*.patch; do
            echo "Applying: $(basename $p)"
            patch -p1 < "$p" || { echo "FAILED: $p"; exit 1; }
          done

      # 6. Build
      - name: Setup meson
        run: |
          cd dxvk-sarek
          case "${{ matrix.arch }}" in
            x86_64) cross=build-win64.txt ;;
            i686)   cross=build-win32.txt ;;
          esac
          meson setup build \
            --cross-file "$cross" \
            --buildtype release \
            -Denable_tests=false

      - name: Compile
        run: |
          cd dxvk-sarek
          ninja -C build -j$(nproc)

      # 7. Package artifacts
      - name: Package DLLs
        run: |
          mkdir -p artifacts
          case "${{ matrix.arch }}" in
            x86_64) bit=64 ;;
            i686)   bit=32 ;;
          esac
          cp dxvk-sarek/build/src/d3d11/libd3d11.so  artifacts/d3d11-${bit}.so || true
          cp dxvk-sarek/build/src/dxgi/libdxgi.so    artifacts/dxgi-${bit}.so   || true
          cp dxvk-sarek/build/src/dxvk/libdxvk.so    artifacts/libdxvk-${bit}.so || true
          cp dxvk-sarek/build/src/d3d10/libd3d10.so  artifacts/d3d10-${bit}.so || true
          7z a "vegas-sarek-${bit}.7z" ./artifacts/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vegas-sarek-${{ matrix.arch }}
          path: vegas-sarek-*.7z

  create-release:
    needs: [build]
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/vegas-sarek-port' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sarek-port-$(date +%Y%m%d%H%M)"
          name: "VEGAS Port for DXVK-Sarek (development build)"
          body: |
            Automated build of VEGAS optimizations ported to DXVK-Sarek.

            **Changes:**
            - Draw threshold governor (flush command list after N draws)
            - Dynamic VRAM swap (`dxgi.maxDeviceMemory` = 40% of RAM)
            - Adreno GPU persona mask (GTX 1050 Ti / 1070 / RTX 3060)
            - Dummy composition swapchain + deferred surface creation
            - Backbuffer count fix (min 2 buffers)

            **Note:** No FSR, framegen, or BCn→ASTC transcoder — only lightweight
            performance optimizations for Adreno 610 (Hollow Knight OOM fix).
          files: |
            vegas-sarek-*/vegas-sarek-*.7z
          draft: false
          prerelease: true
